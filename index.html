<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>城市旅游攻略 · 索引页</title>
    <style>
        :root {
            --primary: #0a6e7c;
            --primary-light: #e8f4f6;
            --accent: #f59e0b;
            --accent-light: #fef3c7;
            --text: #1e293b;
            --text-light: #64748b;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.07);
            --shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.12);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font-sans: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-wrapper {
            width: 100%;
            max-width: 1200px;
            padding: 20px 20px 40px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .app-header {
            text-align: center;
            margin-bottom: 24px;
            padding: 30px 10px 10px;
        }

        .app-header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .app-header p {
            color: var(--text-light);
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }

        .tab-nav {
            display: flex;
            gap: 8px;
            background: #ffffff;
            border-radius: 50px;
            padding: 8px;
            box-shadow: var(--shadow);
            margin-bottom: 28px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tab-btn {
            flex: 1 1 auto;
            min-width: 100px;
            padding: 10px 20px;
            border-radius: 40px;
            border: none;
            background: transparent;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-light);
            cursor: pointer;
            transition: var(--transition);
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .tab-btn:hover {
            background: var(--primary-light);
            color: var(--primary);
        }
        .tab-btn.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 12px rgba(10, 110, 124, 0.3);
        }

        .tab-content {
            flex: 1;
            background: transparent;
            border-radius: var(--radius);
            min-height: 600px;
        }

        .tab-pane {
            display: none;
            animation: fadeIn 0.35s ease;
        }
        .tab-pane.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .pane-iframe-wrapper {
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            border: 1px solid #edf2f7;
            height: 80vh;
            min-height: 600px;
        }

        .pane-iframe-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .placeholder-pane {
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 60px 30px;
            text-align: center;
            border: 1px solid #edf2f7;
            min-height: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .placeholder-pane .icon {
            font-size: 4rem;
            opacity: 0.6;
        }
        .placeholder-pane h3 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text);
        }
        .placeholder-pane p {
            color: var(--text-light);
            max-width: 400px;
        }

        @media (max-width: 768px) {
            .app-header h1 {
                font-size: 1.7rem;
            }
            .tab-nav {
                border-radius: 30px;
                padding: 6px;
                gap: 4px;
            }
            .tab-btn {
                padding: 8px 14px;
                font-size: 0.85rem;
                min-width: 70px;
            }
            .pane-iframe-wrapper {
                height: 70vh;
            }
        }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <header class="app-header">
            <h1>🌍 城市旅游攻略</h1>
            <p>选择一个城市，探索专属深度旅行计划</p>
        </header>

        <nav class="tab-nav" id="tabNav">
            <button class="tab-btn active" data-target="shenzhen">深圳</button>
            <button class="tab-btn" data-target="guangzhou">广州</button>
            <button class="tab-btn" data-target="zhuhai">珠海</button>
        </nav>

        <div class="tab-content">
            <div class="tab-pane active" id="shenzhen">
                <div class="pane-iframe-wrapper">
                    <iframe id="shenzhenFrame" title="深圳一周旅游攻略" srcdoc=""></iframe>
                </div>
            </div>
            <div class="tab-pane" id="guangzhou">
                <div class="placeholder-pane">
                    <div class="icon">🌆</div>
                    <h3>广州攻略 · 敬请期待</h3>
                    <p>广州深度游攻略正在整理中，即将上线。</p>
                </div>
            </div>
            <div class="tab-pane" id="zhuhai">
                <div class="placeholder-pane">
                    <div class="icon">🏝️</div>
                    <h3>珠海攻略 · 敬请期待</h3>
                    <p>珠海浪漫海岛之旅攻略制作中，敬请关注。</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 隐藏的深圳攻略模板（包含锚点跳转） -->
    <script type="text/html" id="shenzhenGuideTemplate">
        <!DOCTYPE html>
        <html lang="zh-CN">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>深圳一周旅游攻略</title>
            <style>
                :root {
                    --primary: #0a6e7c;
                    --primary-light: #e8f4f6;
                    --accent: #f59e0b;
                    --accent-light: #fef3c7;
                    --text: #1e293b;
                    --text-light: #64748b;
                    --bg: #f8fafc;
                    --card-bg: #ffffff;
                    --shadow: 0 4px 24px rgba(0, 0, 0, 0.07);
                    --shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.12);
                    --radius: 16px;
                    --radius-sm: 10px;
                    --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                    --font-sans: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
                }

                /* 顶部导航（日内） */
                .day-nav {
                    position: sticky;
                    top: 0;

                    padding: 10px 15px;

                    gap: 6px;

                    font-size: 0.8rem;
                    font-weight: 600;
                    color: var(--text-light);
                    background: #f1f5f9;
                    transition: var(--transition);
                    flex-shrink: 0;

                .day-nav a:hover {
                    background: var(--primary);
                    color: #fff;

                .hero {

                    padding: 60px 20px 50px;
                    text-align: center;
                    position: relative;
                    overflow: hidden;
                }
                .hero::before {
                    content: '';
                    position: absolute;
                    top: -50%; left: -50%;
                    width: 200%; height: 200%;
                    background: radial-gradient(circle at 30% 40%, rgba(255,255,255,0.06) 0%, transparent 50%),
                                radial-gradient(circle at 70% 60%, rgba(255,255,255,0.04) 0%, transparent 40%);

                    pointer-events: none;
                }
                @keyframes heroFloat { 0%,100% { transform: translate(0,0); } 50% { transform: translate(2%,-2%); } }
                .hero-content { position: relative; z-index: 1; max-width: 800px; margin: 0 auto; }
                .hero-badge { display: inline-block; background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); padding: 6px 18px; border-radius: 50px; font-size: 0.85rem; letter-spacing: 2px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.25); }
                .hero h1 { font-size: 2.8rem; font-weight: 800; letter-spacing: -1px; margin-bottom: 16px; text-shadow: 0 2px 20px rgba(0,0,0,0.15); }
                .hero p { font-size: 1.1rem; opacity: 0.92; max-width: 600px; margin: 0 auto; letter-spacing: 0.5px; }
                .hero-stats { display: flex; justify-content: center; gap: 35px; margin-top: 30px; flex-wrap: wrap; }
                .hero-stat { text-align: center; }
                .hero-stat-number { font-size: 1.8rem; font-weight: 700; display: block; }
                .hero-stat-label { font-size: 0.8rem; opacity: 0.8; letter-spacing: 1px; }
                .container { max-width: 1000px; margin: 0 auto; padding: 30px 20px 50px; }
                .overview-section { margin-bottom: 40px; }
                .section-title { font-size: 1.6rem; font-weight: 700; color: var(--text); margin-bottom: 8px; letter-spacing: -0.5px; display: flex; align-items: center; gap: 10px; }
                .section-title .icon { font-size: 1.4rem; }
                .section-subtitle { color: var(--text-light); font-size: 0.9rem; margin-bottom: 20px; letter-spacing: 0.3px; }
                .overview-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
                .overview-card {
                    display: block;
                    background: var(--card-bg);
                    border-radius: var(--radius-sm);
                    padding: 16px 12px;
                    text-align: center;
                    box-shadow: var(--shadow);
                    transition: var(--transition);
                    border: 1px solid #edf2f7;
                    text-decoration: none;
                    color: inherit;
                    cursor: pointer;
                }
                .overview-card:hover {
                    transform: translateY(-3px);
                    box-shadow: var(--shadow-hover);
                    border-color: var(--primary-light);
                }
                .overview-card .day-num { font-size: 1.4rem; font-weight: 800; color: var(--primary); display: block; }
                .overview-card .day-label { font-size: 0.75rem; color: var(--text-light); letter-spacing: 1px; margin-top: 2px; }
                .overview-card .day-location { font-size: 0.7rem; color: var(--accent); font-weight: 600; margin-top: 6px; letter-spacing: 0.5px; }
                .days-grid { display: grid; grid-template-columns: 1fr; gap: 24px; }
                .day-card {
                    background: var(--card-bg);
                    border-radius: var(--radius);
                    box-shadow: var(--shadow);
                    overflow: hidden;
                    transition: var(--transition);
                    border: 1px solid #edf2f7;
                    scroll-margin-top: 70px;
                }
                .day-card:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }
                .day-header { display: flex; align-items: center; gap: 14px; padding: 18px 22px; background: linear-gradient(135deg, #f0f9fa 0%, #e8f4f6 100%); border-bottom: 1px solid #e2e8f0; flex-wrap: wrap; }
                .day-badge { width: 42px; height: 42px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; font-weight: 700; flex-shrink: 0; }
                .day-header-info h2 { font-size: 1.2rem; font-weight: 700; color: var(--text); line-height: 1.3; }
                .day-header-info .day-theme { font-size: 0.8rem; color: var(--text-light); letter-spacing: 0.5px; }
                .day-tag { margin-left: auto; background: var(--accent-light); color: #92400e; padding: 4px 12px; border-radius: 50px; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.5px; flex-shrink: 0; }
                .day-body { padding: 20px 22px; }
                .spots-list { list-style: none; display: grid; gap: 12px; }
                .spot-item { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; background: #fafcfe; border-radius: var(--radius-sm); border: 1px solid #edf2f7; transition: var(--transition); }
                .spot-item:hover { background: var(--primary-light); border-color: #bcd9de; }
                .spot-icon { font-size: 1.3rem; flex-shrink: 0; line-height: 1; margin-top: 2px; }
                .spot-details h4 { font-size: 0.9rem; font-weight: 700; color: var(--text); margin-bottom: 2px; }
                .spot-details p { font-size: 0.8rem; color: var(--text-light); line-height: 1.5; }
                .day-extras { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 16px; }
                .extra-box { background: #fafcfe; border-radius: var(--radius-sm); padding: 14px 16px; border: 1px solid #edf2f7; }
                .extra-box h5 { font-size: 0.8rem; font-weight: 700; color: var(--primary); margin-bottom: 6px; letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px; }
                .extra-box p { font-size: 0.78rem; color: var(--text-light); line-height: 1.5; }
                .tips-section { margin-top: 40px; }
                .tips-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
                .tip-card { background: var(--card-bg); border-radius: var(--radius-sm); padding: 18px; box-shadow: var(--shadow); border: 1px solid #edf2f7; text-align: center; transition: var(--transition); }
                .tip-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); }
                .tip-icon { font-size: 1.8rem; margin-bottom: 8px; }
                .tip-card h4 { font-size: 0.9rem; font-weight: 700; margin-bottom: 4px; color: var(--text); }
                .tip-card p { font-size: 0.78rem; color: var(--text-light); }
                .footer { text-align: center; padding: 25px 20px; color: var(--text-light); font-size: 0.78rem; border-top: 1px solid #e2e8f0; letter-spacing: 0.5px; }
                @media (max-width: 768px) {
                    .hero h1 { font-size: 2rem; }
                    .hero { padding: 40px 16px 35px; }
                    .day-extras { grid-template-columns: 1fr; }
                    .day-header { padding: 14px 16px; gap: 10px; }
                    .day-body { padding: 16px; }

                    .hero h1 { font-size: 1.6rem; }
                    .spot-item { flex-direction: column; gap: 6px; }
                }
            </style>
        </head>
        <body>
            <!-- 日内导航条（用于快速跳转） -->
            <nav class="day-nav">

            <header class="hero">

                    </article>
                    <article class="day-card" id="day2">
                        <div class="day-header"><div class="day-badge">2</div><div class="day-header-info"><h2>世界之窗 · 锦绣中华民俗村</h2><span class="day-theme">🎡 主题乐园日 · 南山区</span></div><span class="day-tag">🎢 全天游览</span></div>

                            <ul class="spots-list">

    <script>
        (function() {
            // 将深圳攻略模板注入iframe
            const shenzhenFrame = document.getElementById('shenzhenFrame');
            const template = document.getElementById('shenzhenGuideTemplate');
            if (shenzhenFrame && template) {
                shenzhenFrame.setAttribute('srcdoc', template.innerHTML);
            }

            // 标签页切换逻辑
            const tabButtons = document.querySelectorAll('.tab-btn');
            const tabPanes = document.querySelectorAll('.tab-pane');

            function switchTab(targetId) {
                tabButtons.forEach(btn => btn.classList.remove('active'));
                tabPanes.forEach(pane => pane.classList.remove('active'));

                const activeButton = document.querySelector(`.tab-btn[data-target="${targetId}"]`);
                const activePane = document.getElementById(targetId);
                if (activeButton) activeButton.classList.add('active');
                if (activePane) activePane.classList.add('active');
            }

            tabButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    const target = this.getAttribute('data-target');
                    switchTab(target);
                });
            });

            // 默认激活深圳
            switchTab('shenzhen');
        })();
    </script>
